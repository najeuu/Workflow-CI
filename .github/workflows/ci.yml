name: CI - Training Model Telco Churn

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPERIMENT_NAME: "Telco Churn CI"
  IMAGE_NAME: telco-churn-model

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          ls -R MLProject

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==3.17.2 pandas scikit-learn matplotlib cloudpickle

      - name: Set MLflow Tracking URI
        run: echo "MLFLOW_TRACKING_URI=sqlite:///${{ github.workspace }}/mlflow.db" >> $GITHUB_ENV

      - name: Run mlflow project
        run: mlflow run MLProject --env-manager=local --experiment-name "$EXPERIMENT_NAME"

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "
          from mlflow.tracking import MlflowClient
          c = MlflowClient()
          exp = c.get_experiment_by_name('$EXPERIMENT_NAME')
          r = c.search_runs([exp.experiment_id], order_by=['attributes.start_time DESC'], max_results=1)[0]
          print(r.info.run_id)
          ")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns/

      - name: Upload artifacts to GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlruns/
          git diff --staged --quiet || git commit -m "Simpan artefak model run $RUN_ID [skip ci]"
          git push

      - name: Build Docker Model
        run: mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "$IMAGE_NAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag "$IMAGE_NAME" "${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest"
          docker tag "$IMAGE_NAME" "${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ github.run_number }}"

      - name: Push Docker Image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${{ github.run_number }}"
